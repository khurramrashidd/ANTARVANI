name: silent_voice_recorder
description: ANTARVANI — corpus recorder for the Hindi silent-speech dataset.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # capture
  camera: ^0.11.0
  video_player: ^2.9.1

  # on-device quality control
  google_mlkit_face_detection: ^0.12.0

  # unified index across all 4 phones (offline-first, syncs itself)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # video upload to the shared project Drive
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # plumbing
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2

  # patient side
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.1

  # sidebar header: location, weather
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/antarvani_icon_1024.png
    - assets/logo/antarvani_logo_rounded.png

# App icon. Generate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/antarvani_icon_1024.png
  adaptive_icon_background: assets/logo/antarvani_icon_background.png
  adaptive_icon_foreground: assets/logo/antarvani_icon_foreground.png
  min_sdk_android: 24
