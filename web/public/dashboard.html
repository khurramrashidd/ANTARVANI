<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANTARVANI — team dashboard</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%236366f1'/><path d='M14 32c6-9 12-13 18-13s12 4 18 13c-6 9-12 13-18 13s-12-4-18-13z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/><circle cx='32' cy='32' r='5' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script>
/* Theme before first paint, so a remembered dark never flashes light.
   Light is the default; dark is only used if it was asked for here. */
(function () {
  try {
    if (localStorage.getItem('antarvani-theme') === 'dark')
      document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
  document.documentElement.classList.add('js');
})();
</script>
</head>
<body>

<!-- Sign-in gate ------------------------------------------------------ -->
<div style="position:absolute;top:18px;right:18px;z-index:2">
  <button class="theme" id="themeBtnGate" type="button" aria-pressed="false" title="Switch to dark">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="sr">Toggle dark mode</span>
      </button>
</div>

<div class="gate" id="gate">
  <div class="gate-card">
    <h1>ANTARVANI</h1>
    <p id="gateMsg">Team sign-in. Volunteers' names are only visible to the
      people collecting the corpus.</p>
    <button class="btn btn-primary" id="signIn" style="width:100%">
      Continue with Google
    </button>
    <div id="gateNote" style="margin-top:18px"></div>
    <p style="margin:22px 0 0">
      <a href="index.html" style="color:var(--ink-3);font-size:.85rem">
        ← Back to the project page</a>
    </p>
  </div>
</div>

<!-- Dashboard --------------------------------------------------------- -->
<main id="dash" hidden>
  <div class="wrap">
    <div class="dash-head">
      <div class="who">
        <img id="avatar" alt="" hidden>
        <div>
          <div id="userName">—</div>
          <div class="role" id="userRole"></div>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-sm" href="index.html">Project page</a>
        <button class="btn btn-sm" id="refresh">Refresh</button>
        <button class="btn btn-sm" id="signOut">Sign out</button>
        <button class="theme" id="themeBtn" type="button" aria-pressed="false" title="Switch to dark">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="sr">Toggle dark mode</span>
      </button>
      </div>
    </div>

    <div id="dashBody">
      <div class="stats g4" id="tiles"></div>
    </div>
  </div>
  <div style="height:60px"></div>
</main>

<script src="assets/theme.js"></script>
<script src="assets/firebase-config.js"></script>
<script type="module" src="assets/dashboard.js"></script>
<script>
/* If the Firebase SDK cannot be fetched — a blocked network, a captive
   portal, venue wifi — the module above never runs and the sign-in button
   silently does nothing. Six seconds is long enough to be sure, and being
   told beats tapping a dead button in front of an audience. */
setTimeout(function () {
  if (window.__dashReady) return;
  var note = document.getElementById('gateNote');
  if (!note || note.children.length) return;
  note.innerHTML = '<div class="notice bad"><b>Could not load Firebase.</b>' +
    '<br>The sign-in library is fetched from gstatic.com; this network ' +
    'looks to be blocking it. Try another connection or a phone hotspot. ' +
    'The project page needs none of this and works offline.</div>';
  var b = document.getElementById('signIn');
  if (b) b.disabled = true;
}, 6000);
</script>
</body>
</html>
